name: Apply official PRAGA schedule

on:
  push:
    paths:
      - '.github/workflows/apply-official-schedule.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deploy and update production schedule
        run: |
          set -euo pipefail
          URL='https://my-project-psi-sage.vercel.app/api/internal/update-official-schedule?confirm=official-praga-schedule'
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then
              cat /tmp/resp.json
              break
            fi
            echo "Attempt $i: HTTP $CODE, waiting..."
            sleep 10
          done
          python - <<'PY'
          import json
          data=json.load(open('/tmp/resp.json'))
          assert data.get('ok') is True, data
          assert data['schedule'][0]['days'] == 'Domingo'
          assert data['schedule'][1]['days'] == 'Lunes a Viernes'
          assert data['schedule'][2]['days'] == 'Sábado'
          print('Schedule update applied')
          PY

      - name: Verify public site config
        run: |
          curl --fail --silent --show-error 'https://my-project-psi-sage.vercel.app/api/site-config' -o /tmp/config.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/config.json'))
          schedule=data.get('contacto',{}).get('schedule',[])
          print(json.dumps(schedule, ensure_ascii=False, indent=2))
          assert schedule == [
            {'days':'Domingo','hours':'10:00 a. m. – 4:00 p. m.'},
            {'days':'Lunes a Viernes','hours':'10:00 a. m. – 1:00 p. m. / 2:00 p. m. – 5:00 p. m.'},
            {'days':'Sábado','hours':'10:00 a. m. – 5:00 p. m.'},
          ]
          print('Live schedule verified')
          PY

name: Apply Atrio gallery cleanup

on:
  push:
    paths:
      - '.github/workflows/apply-atrio-cleanup.yml'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deploy and remove last two Atrio images
        run: |
          set -euo pipefail
          URL='https://my-project-psi-sage.vercel.app/api/internal/remove-atrium-last-two?confirm=remove-atrium-last-two'
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then
              cat /tmp/resp.json
              break
            fi
            echo "Attempt $i: HTTP $CODE, waiting..."
            sleep 10
          done
          test "$(python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/resp.json'))
              print('yes' if d.get('ok') and d.get('atrioRemaining') == 6 else 'no')
          except Exception:
              print('no')
          PY
          )" = "yes"

      - name: Verify live gallery
        run: |
          curl --fail --silent --show-error 'https://my-project-psi-sage.vercel.app/api/site-config' -o /tmp/config.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/config.json'))
          atrio=[x for x in data.get('galeria',{}).get('items',[]) if x.get('category')=='Atrio']
          print(json.dumps(atrio, ensure_ascii=False, indent=2))
          assert len(atrio) == 6, len(atrio)
          assert all(x.get('id') not in (14,15) for x in atrio)
          print('Atrio gallery cleanup verified')
          PY

name: Diagnose PRAGA build
# validate CMS after chat type fix

on:
  push:
    paths:
      - '.github/workflows/diagnose-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
